name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 포맷 검사
        run: npm run format:check

      - name: 린트 검사
        run: npm run lint

      - name: 타입 검사
        run: npm run type-check

      - name: 단위 테스트
        run: npm run test:unit -- --run

      - name: 프로덕션 빌드
        run: npm run build
